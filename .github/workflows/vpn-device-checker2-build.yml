name: Build VPN Device Checker 2 APK

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter Android shell
        run: |
          rm -rf buildapp
          flutter create --platforms=android --org com.svyatoslav --project-name vpn_device_checker buildapp
          mkdir -p /tmp/vdc2src
          cat vdc2src.00.b64 vdc2src.01.b64 vdc2src.02.b64 vdc2src.03.b64 | base64 -d > /tmp/vdc2src.tgz
          tar -xzf /tmp/vdc2src.tgz -C /tmp/vdc2src
          cp /tmp/vdc2src/pubspec.yaml buildapp/pubspec.yaml
          cp /tmp/vdc2src/main.dart buildapp/lib/main.dart

      - name: Patch app for ASK-VPN probing
        run: python3 tools/patch_vdc201.py

      - name: Use latest flutter_vless Android runtime
        run: |
          git clone --depth 1 https://github.com/XIIIFOX/flutter_vless.git /tmp/flutter_vless
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil
          root = Path('/tmp/flutter_vless')
          def path_dep(file, name, relpath):
              p = root / file
              s = p.read_text()
              s, n = re.subn(rf'(?m)^  {re.escape(name)}:\s*\^?[^\n]+$', f'  {name}:\n    path: {relpath}', s)
              if n == 0:
                  print(f'warning: dependency {name} not replaced in {file}')
              p.write_text(s)
          path_dep('pubspec.yaml', 'flutter_vless_platform_interface', 'packages/flutter_vless_platform_interface')
          path_dep('pubspec.yaml', 'flutter_vless_android', 'packages/flutter_vless_android')
          path_dep('pubspec.yaml', 'flutter_vless_macos', 'packages/flutter_vless_macos')
          path_dep('pubspec.yaml', 'flutter_vless_windows', 'packages/flutter_vless_windows')
          path_dep('packages/flutter_vless_android/pubspec.yaml', 'flutter_vless_platform_interface', '../flutter_vless_platform_interface')
          path_dep('packages/flutter_vless_macos/pubspec.yaml', 'flutter_vless_platform_interface', '../flutter_vless_platform_interface')
          path_dep('packages/flutter_vless_windows/pubspec.yaml', 'flutter_vless_platform_interface', '../flutter_vless_platform_interface')
          vendor = Path('buildapp/vendor/flutter_vless')
          vendor.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(root, vendor, symlinks=True, ignore=shutil.ignore_patterns('.git', 'build', '.dart_tool'))
          pub = Path('buildapp/pubspec.yaml')
          s = pub.read_text()
          s, n = re.subn(r'(?m)^  flutter_vless:\s*\^?[^\n]+$', '  flutter_vless:\n    path: vendor/flutter_vless', s)
          if n != 1:
              raise SystemExit(f'app flutter_vless dependency replacement count={n}')
          pub.write_text(s)
          PY

      - name: Add Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('buildapp/android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android.permission.INTERNET' not in s:
              s=s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />')
          p.write_text(s)
          PY

      - name: Resolve dependencies
        working-directory: buildapp
        run: flutter pub get

      - name: Enable true concurrent Xray probes
        run: |
          PLUGIN="buildapp/vendor/flutter_vless/packages/flutter_vless_android/android/src/main/kotlin/com/github/tfox/flutter_vless/FlutterVlessPlugin.kt"
          test -f "$PLUGIN"
          sed -i 's/Executors.newSingleThreadExecutor()/Executors.newFixedThreadPool(12)/' "$PLUGIN"
          grep -n 'newFixedThreadPool' "$PLUGIN" || true

      - name: Build APK
        working-directory: buildapp
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: VPNDeviceChecker-2.0.1-debug
          path: buildapp/build/app/outputs/flutter-apk/app-debug.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp buildapp/build/app/outputs/flutter-apk/app-debug.apk VPNDeviceChecker-2.0.1-ASKVPN-fix.apk
          if gh release view v2.0.1 >/dev/null 2>&1; then
            gh release upload v2.0.1 VPNDeviceChecker-2.0.1-ASKVPN-fix.apk --clobber
          else
            gh release create v2.0.1 VPNDeviceChecker-2.0.1-ASKVPN-fix.apk \
              --title "VPN Device Checker 2.0.1" \
              --notes "Fixes ASK-VPN real-test false failures: tries up to 30 profiles, uses multiple HTTP probe endpoints, and builds against the latest flutter_vless/Xray Android runtime. A delay=-1 result is no longer treated as a device-limit result. Debug-signed Android build."
          fi
